name: publish-central

# Publishes the artifacts to Maven Central through the Central Portal. Run by hand: a version on Central can never be
# changed or removed, so nothing here triggers automatically. See docs/PUBLISHING.md for the one-time setup (namespace,
# token, signing key) and for the checks to do before and after.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or commit to publish'
        required: true
        default: 'main'
      auto-publish:
        description: 'Publish as soon as Central validates the upload. Leave off to review the deployment in the Portal first.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # An environment lets you require a reviewer before this job gets the secrets (Settings > Environments).
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check the setup before building
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD GPG_PRIVATE_KEY; do
            [ -n "${!name}" ] || { echo "::error::The secret $name is not set. See docs/PUBLISHING.md."; exit 1; }
          done
          version=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          case "$version" in
            *SNAPSHOT*) echo "::error::$version is a snapshot; Central takes releases only."; exit 1;;
          esac
          echo "Publishing $version from ${{ inputs.ref }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build, sign and upload
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -Prelease -Dcentral.autoPublish=${{ inputs.auto-publish }} deploy
