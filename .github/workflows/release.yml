name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Derive the human-readable version from the tag (v0.2.0 → 0.2.0)
      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Validate that the POM version matches the tag — catches the common mistake
      # of pushing a tag without bumping the POM first.
      - name: Verify POM version matches tag
        run: |
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$POM_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::POM version ($POM_VERSION) does not match tag ($TAG_VERSION)."
            echo "::error::Run: mvn versions:set -DnewVersion=${TAG_VERSION} -DgenerateBackupPoms=false"
            echo "::error::Then commit, tag, and push."
            exit 1
          fi

      # Full build + tests
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      # Rename the artifact to include the version for clarity
      - name: Prepare artifact
        run: |
          cp diagscope-cli/target/diagscope.jar \
             diagscope-cli/target/diagscope-${{ steps.version.outputs.version }}.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DiagScope ${{ steps.version.outputs.version }}
          body: |
            ## DiagScope ${{ steps.version.outputs.version }}

            ### Download

            Download `diagscope-${{ steps.version.outputs.version }}.jar` below — requires **Java 25+**.

            ```bash
            # Run directly
            java -jar diagscope-${{ steps.version.outputs.version }}.jar scan --help

            # Alias for convenience
            alias diagscope='java -jar /path/to/diagscope-${{ steps.version.outputs.version }}.jar'
            diagscope scan /path/to/your/project
            ```

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full usage.
          files: diagscope-cli/target/diagscope-${{ steps.version.outputs.version }}.jar
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
