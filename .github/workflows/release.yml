name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Derive the human-readable version from the tag (v0.2.0 → 0.2.0)
      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Validate that the POM version matches the tag — catches the common mistake
      # of pushing a tag without bumping the POM first.
      - name: Verify POM version matches tag
        run: |
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$POM_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::POM version ($POM_VERSION) does not match tag ($TAG_VERSION)."
            echo "::error::Run: mvn versions:set -DnewVersion=${TAG_VERSION} -DgenerateBackupPoms=false"
            echo "::error::Then commit, tag, and push."
            exit 1
          fi

      # Full build + tests
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      # Rename the artifact to include the version for clarity
      - name: Prepare artifact
        id: artifact
        run: |
          JAR="diagscope-cli/target/diagscope-${{ steps.version.outputs.version }}.jar"
          cp diagscope-cli/target/diagscope.jar "$JAR"
          SHA256=$(sha256sum "$JAR" | awk '{print $1}')
          echo "jar=${JAR}"     >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      # Publish the JAR to the public DiagScope/releases repo so Homebrew
      # (and any unauthenticated user) can download it without needing access
      # to the private source repository.
      - name: Publish to public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: DiagScope/releases
          token: ${{ secrets.RELEASES_PAT }}
          tag_name: ${{ github.ref_name }}
          name: DiagScope ${{ steps.version.outputs.version }}
          body: |
            ## DiagScope ${{ steps.version.outputs.version }}

            ### Install via Homebrew (recommended)

            ```bash
            brew tap DiagScope/tap
            brew install diagscope
            ```

            ### Manual download

            Download `diagscope-${{ steps.version.outputs.version }}.jar` below — requires **Java 25+**.

            ```bash
            java -jar diagscope-${{ steps.version.outputs.version }}.jar scan --help
            ```

            See the [README](https://github.com/DiagScope/diagscope/blob/main/README.md) for full usage.
          files: ${{ steps.artifact.outputs.jar }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}

      # Notify the Homebrew tap to update its formula.
      # Requires a PAT with 'repo' scope stored as HOMEBREW_TAP_TOKEN.
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh api repos/DiagScope/homebrew-tap/dispatches \
            --method POST \
            --field event_type=new-release \
            --field client_payload[version]="${{ steps.version.outputs.version }}" \
            --field client_payload[sha256]="${{ steps.artifact.outputs.sha256 }}"
