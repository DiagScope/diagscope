name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The artifacts target Java 17 (ADR-0009). They are built with JDK 25 and every test runs on the JVM named by
  # test-jdk, so a Java 21 or 25 API leaking into the code fails the 17 leg, and a 17 runtime that the code no longer
  # supports is caught before a release.
  verify:
    name: verify (tests on JDK ${{ matrix.test-jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-jdk: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Every version is exposed as JAVA_HOME_<version>_X64. JAVA_HOME itself ends up on the last one, so the steps
          # below choose the build JDK explicitly.
          java-version: |
            25
            21
            17
          cache: maven
      - name: Build and test
        run: |
          export JAVA_HOME="$JAVA_HOME_25_X64"
          TEST_JAVA="$(printenv JAVA_HOME_${{ matrix.test-jdk }}_X64)/bin/java"
          "$TEST_JAVA" -version
          mvn --batch-mode --no-transfer-progress clean verify -Djvm="$TEST_JAVA"

  # The Maven plugin runs inside Maven's own JVM, so it needs a leg where Maven itself runs on the oldest supported JDK.
  maven-plugin-on-java-17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            17
          cache: maven
      - name: Install the artifacts
        run: JAVA_HOME="$JAVA_HOME_25_X64" mvn --batch-mode --no-transfer-progress -DskipTests install
      - name: Run the plugin with Maven on Java 17
        run: JAVA_HOME="$JAVA_HOME_17_X64" scripts/ci/maven-plugin-smoke.sh

  # Publishing to Maven Central cannot be undone, so the bundle is assembled here on every push, with a throwaway key:
  # a broken javadoc, a missing source jar or a signing misconfiguration fails now and not on release day. Nothing is
  # uploaded (central.skipUpload).
  central-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Throwaway signing key
        run: |
          cat > /tmp/key-params <<'KEY'
          %no-protection
          Key-Type: RSA
          Key-Length: 3072
          Name-Real: CI bundle check
          Name-Email: ci@example.invalid
          Expire-Date: 1d
          %commit
          KEY
          gpg --batch --gen-key /tmp/key-params
      - name: Assemble the bundle
        run: mvn --batch-mode --no-transfer-progress -Prelease -Dcentral.skipUpload=true -DskipTests deploy
      - name: Check what Central requires
        run: scripts/ci/check-central-bundle.sh target/central-publishing/central-bundle.zip
